[project]
name = "recipyai-backend"
version = "0.1.0"
description = "RecipyAI backend — YouTube cooking videos to structured recipes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "arq>=0.26",
    "redis>=5.2",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.17",
    "email-validator>=2.2",
    "httpx>=0.27",
    "anthropic>=0.39",
    "openai>=1.54",
    "yt-dlp>=2025.4.30",
    "youtube-transcript-api>=0.6.3",
]

[project.optional-dependencies]
whisper-local = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
