services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recipyai
      POSTGRES_PASSWORD: recipyai
      POSTGRES_DB: recipyai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipyai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # The yt-dlp helper reads this; if the mounted file is empty (the
      # default placeholder), yt-dlp simply finds no useful cookies. To
      # bypass YouTube's bot check on data-center IPs, replace
      # backend/youtube_cookies.txt with a real export from a logged-in
      # browser session. See DEPLOY.md.
      YT_DLP_COOKIES_FILE: /cookies/youtube.txt
    volumes:
      - ./:/app
      - ./youtube_cookies.txt:/cookies/youtube.txt:ro

  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    environment:
      YT_DLP_COOKIES_FILE: /cookies/youtube.txt
    volumes:
      - ./:/app
      - ./youtube_cookies.txt:/cookies/youtube.txt:ro

volumes:
  pgdata:
